# Prometheus da etapa 3. Sobe com docker-compose.monitoring.yml.

global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    stack: tech-challenge-fase4

# As regras vivem em arquivo, versionadas e testadas por `promtool test rules`
# no CI. Regra de alerta em UI é regra que ninguém revisa.
rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  # O Pushgateway é o único alvo que carrega dado do pipeline.
  #
  # honor_labels: true é obrigatório e não opcional. Sem ele o Prometheus
  # sobrescreve os rótulos `job` e `instance` que o job de lote empurrou pelos
  # do próprio scrape — isto é, tudo viraria job="pushgateway" e as séries dos
  # sete meses se fundiriam numa só.
  - job_name: pushgateway
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["pushgateway:9091"]

  # Auto-scrape: dá o `up` do próprio Prometheus, que é como se distingue
  # "o pipeline não rodou" de "o Prometheus parou".
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
